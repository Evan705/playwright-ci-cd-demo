name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Playwright test image
        run: docker build -t eventhub-playwright:${{ github.sha }} .

      - name: Run Playwright tests in container
        # CI=true makes the HTML reporter skip opening a report server,
        # which would otherwise block inside the container.
        run: |
          mkdir -p playwright-report
          docker run --rm --ipc=host \
            -e CI=true \
            -v "$PWD/playwright-report:/app/playwright-report" \
            eventhub-playwright:${{ github.sha }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn
